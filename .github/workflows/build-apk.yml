name: Build GaonCart APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Validate API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          url="${API_BASE_URL%/}"
          re='^https://[A-Za-z0-9.-]+(:[0-9]{2,5})?(/[A-Za-z0-9._~/-]*)?$'
          if [ -z "$url" ] || ! [[ "$url" =~ $re ]]; then
            echo "::error::Set a valid HTTPS API_BASE_URL in repository variables."
            exit 1
          fi
          echo "API_BASE_URL_CLEAN=$url" >> "$GITHUB_ENV"

      - name: Extract and locate Flutter project
        run: |
          mkdir -p _src
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d _src
          done
          mapfile -t found < <(find . -name pubspec.yaml -not -path './.git/*' -print0 | xargs -r -0 grep -l '^name: gaoncart$' || true)
          if [ ${#found[@]} -ne 1 ]; then
            echo "::error::GaonCart Flutter project not found or duplicated."
            exit 1
          fi
          dir="$(dirname "${found[0]}")"
          echo "APP_DIR=${dir#./}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create . --platforms=android --org in.gaoncart --project-name gaoncart
          rm -f test/widget_test.dart

      - name: Apply Android settings
        working-directory: ${{ env.APP_DIR }}
        run: python3 tools/patch_android.py

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test

      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL_CLEAN"

      - name: Build Release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-shrink --dart-define=API_BASE_URL="$API_BASE_URL_CLEAN"

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GaonCart-APKs
          path: |
            ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 14
